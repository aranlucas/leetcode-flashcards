---
backend:
  name: github
  repo: aranlucas/leetcode-flashcards
  branch: main
  base_url: https://netlify-cms-mauve.vercel.app/
local_backend: true
media_folder: public/img
public_folder: img
collections:
  - name: "learn"
    label: "LeetCode"
    folder: "content/learn"
    create: true
    slug: "{{slug}}"
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
