---
backend:
  name: github
  repo: aranlucas/mantine-next
  branch: main
  base_url: https://netlify-cms-mauve.vercel.app/
local_backend: true
media_folder: public/img
public_folder: img
collections:
  - name: pages
    label: Pages
    files:
      - label: Home
        name: home
        file: content/pages/home.md
        fields:
          - label: Hero Title
            name: title
            widget: string
          - label: Hero Description
            name: description
            widget: markdown
  - name: "learn" # Used in routes, e.g., /admin/collections/blog
    label: "LeetCode" # Used in the UI
    folder: "content/learn" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          date_format: "DD.MM.YYYY",
          time_format: "HH:mm",
          format: "LLL",
        }
      - { label: "Body", name: "body", widget: "markdown" }
